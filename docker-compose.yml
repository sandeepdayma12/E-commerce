services:
  frontend:
    build:
      context: ./E-frontend
      dockerfile: dockerfile
      args:
        VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:8001/}
        VITE_CART_URL: ${VITE_CART_URL:-http://localhost:8002/}
        VITE_ORDER_URL: ${VITE_ORDER_URL:-http://localhost:8003/}
        VITE_PAYMENT_URL: ${VITE_PAYMENT_URL:-http://localhost:8004/}
        VITE_PRODUCT_URL: ${VITE_PRODUCT_URL:-http://localhost:18005/}
        VITE_CATEGORY_URL: ${VITE_CATEGORY_URL:-http://localhost:18005/categories/api}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_51SUmqy1hT6WoN8zES32LnSsB7VaHFfoF4sL4JbRnrGBYtHv21HdZj0CfdCPxWbQyv2KZoheSjjt3ZphnuT3K6khC00qLNWqo2N}
    ports:
      - "5173:80"
    depends_on:
      - auth_service
      - cart_service
      - order_service
      - payment_service
      - product_service
    restart: unless-stopped

  auth_service:
    build:
      context: ./Backend/auth
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://sandeep:sandeep@ecommerce_db:5432/ecommerce_db
    depends_on:
      ecommerce_db:
        condition: service_healthy
    ports:
      - "8001:80"
    restart: unless-stopped

  cart_service:
    build:
      context: ./Backend/cart
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql://sandeep:sandeep@ecommerce_db:5432/carts
    depends_on:
      ecommerce_db:
        condition: service_healthy
    ports:
      - "8002:81"
    restart: unless-stopped

  order_service:
    build:
      context: ./Backend/orders
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql://sandeep:sandeep@ecommerce_db:5432/orders_db
      PRODUCT_SERVICE_URL: http://product_service:85
    depends_on:
      ecommerce_db:
        condition: service_healthy
      product_service:
        condition: service_started
    ports:
      - "8003:82"
    restart: unless-stopped

  payment_service:
    build:
      context: ./Backend/payment
      dockerfile: dockerfile
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://sandeep:sandeep@ecommerce_db:5432/payments
    depends_on:
      ecommerce_db:
        condition: service_healthy
    ports:
      - "8004:84"
    restart: unless-stopped

  product_service:
    build:
      context: ./Backend/products
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql://sandeep:sandeep@ecommerce_db:5432/product_services
    depends_on:
      ecommerce_db:
        condition: service_healthy
    ports:
      - "18005:85"
    restart: unless-stopped

  ecommerce_db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: sandeep
      POSTGRES_PASSWORD: sandeep
      POSTGRES_DB: ecommerce_db
    volumes:
      - ecommerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandeep -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  ecommerce_data:
